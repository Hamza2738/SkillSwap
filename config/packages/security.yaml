security:
    password_hashers:
        App\Entity\utilisateur\Utilisateur:
            algorithm: plaintext

    providers:
        app_user_provider:
            entity:
                class: App\Entity\utilisateur\Utilisateur
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: email
                password_parameter: password
                default_target_path: app_dashboard
                always_use_default_target_path: true
                enable_csrf: true

            logout:
                path: app_logout
                target: app_login

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/inscription, roles: PUBLIC_ACCESS }
        - { path: ^/accueil, roles: PUBLIC_ACCESS }
        - { path: ^/forgot-password, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/competences, roles: ROLE_USER }
        - { path: ^/, roles: ROLE_USER }