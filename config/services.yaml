parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # ── Hasher mot de passe en clair (base existante) ──────────────
    App\Security\PlainPasswordHasher:
        public: true